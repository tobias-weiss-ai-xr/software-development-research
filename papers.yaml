  # ── Foundational: The Stoic Unix Philosophy ──────────────────────────────
  - title: "The Stoic Unix Philosophy: Building Calm Tools for a Chaotic World"
    date: "2026-08"
    url: "https://tobias-weiss.org/content/devops/stoic-unix-philosophy/"
    category: "developer-tools"
    subcategory: "method"
    authors:
      - "Tobias Weiss"
    venue: "tobias-weiss.org"
    code_url: ""
    project_url: ""
    abstract: >-
      The Unix philosophy tells us how a tool should be shaped — small,
      composable, text-streaming — but says nothing about how a tool should
      behave when the world is on fire. The Stoic Unix Philosophy is the
      temperament layer: borrowing from Marcus Aurelius, Epictetus, and Seneca
      as engineering discipline. It asks one question of every tool: when
      something outside your control goes wrong, what kind of program are you?
      Covers the dichotomy of control (be rigorous about what you control,
      indifferent to what you don't), apatheia (output is a scarce resource —
      ERROR for action-now, WARN for should-know, DEBUG for developer-only),
      amor fati (idempotency as the mechanical expression of accepting fate),
      virtue is sufficient (do the one job, then return), memento mori (clean
      up — kill children, remove temp files, release locks), and honest failure
      (one true sentence, the correct exit code, never a stack trace for an
      environmental condition). Includes the Stoic Unix Checklist and a case
      study of taskfleet, a declarative LLM orchestrator that embodies these
      principles.
    tags:
      - "unix philosophy"
      - "stoicism"
      - "tooling"
      - "logging"
      - "idempotency"
      - "error handling"
      - "devops"
      - "cli"

  # ── Software Engineering ─────────────────────────────────────────────────
  - title: "No Silver Bullet: Essence and Accidents of Software Engineering"
    date: "1986-04"
    url: "https://doi.org/10.1145/358849.358862"
    category: "software-engineering"
    subcategory: "theory"
    authors:
      - "Fred Brooks"
    venue: "IEEE Computer"
    code_url: ""
    project_url: ""
    abstract: >-
      Classic essay arguing that software engineering has inherent essential
      complexity (conception, design, communication) that cannot be eliminated
      by any single tool or technique. Accidental complexity (language,
      platform, tooling) can be reduced, but the essential difficulty remains.
      Predicts that no single technology — AI, objects, OOP, expert systems —
      will deliver an order-of-magnitude improvement in productivity.
    tags:
      - "software engineering"
      - "complexity"
      - "productivity"
      - "classic"

